<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outpost 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1f;--panel:#111a3d;--panel2:#1a2656;--text:#eaf0ff;--muted:#9aa8d8;--accent:#ffb347;--good:#4ade80;--bad:#f87171;--blue:#60a5fa;--line:#2b3a78}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#16215a 0,#070b1f 60%) fixed;color:var(--text);font:15px/1.6 Audiowide,"Times New Roman",serif;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(7,11,31,.85);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.15rem;letter-spacing:.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.85rem}
main{max-width:1000px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:Audiowide,"Times New Roman",serif;font-weight:400;letter-spacing:.03em}b,strong{font-weight:400;color:#fff}h2{margin:.2em 0 .4em}h3{margin:.2em 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
button{font:inherit;font-weight:400;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:#1b1200;border-color:var(--accent);font-weight:700}
button.sm{padding:4px 10px;font-size:.85rem}
.muted{color:var(--muted)}.small{font-size:.85rem}
.good{color:var(--good)}.bad{color:var(--bad)}
.opt{display:block;text-align:left;width:100%;margin:6px 0}
.opt.sel{border-color:var(--accent);background:#2a2f63}
.opt .ctx{display:block;color:var(--muted);font-size:.85rem}
.bar{height:12px;background:#0a1030;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--good);transition:width .3s}
.bar.warn>i{background:var(--accent)}.bar.danger>i{background:var(--bad)}.bar.blue>i{background:var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.stages{display:flex;gap:8px;margin:6px 0}
.stages div{flex:1;text-align:center;padding:6px;border-radius:8px;border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.stages .on{border-color:var(--accent);color:var(--text);background:#2a2f63}.stages .done{color:var(--good);border-color:var(--good)}
.map{position:relative;height:90px;margin:14px 6px 24px;border-bottom:3px dashed var(--line)}
.map .pt{position:absolute;bottom:-4px;transform:translateX(-50%);text-align:center;font-size:.75rem}
.map .pt span{display:block;font-size:1.4rem}
.map .rv{position:absolute;bottom:22px;transform:translateX(-50%);font-size:1.8rem;transition:left .5s}
.log{max-height:170px;overflow:auto;background:#0a1030;border-radius:10px;padding:8px 12px;font-size:.9rem}
.log p{margin:2px 0}.log .ev{color:var(--accent)}.log .er{color:var(--bad)}.log .ok{color:var(--good)}
.debrief{border-left:4px solid var(--accent);background:#0f1740;padding:10px 14px;border-radius:0 10px 10px 0;margin:8px 0}
canvas{width:100%;max-width:700px;background:#02040f;border:1px solid var(--line);border-radius:10px;display:block;touch-action:none}
select{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--accent);color:#1b1200;font-weight:700;padding:8px 18px;border-radius:999px;z-index:9;box-shadow:0 4px 20px #0008}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:4px;color:var(--muted)}
table{width:100%;border-collapse:collapse}td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
.home-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-family:Audiowide,"Times New Roman",serif;padding-block:8px}
.home-stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.home-stars circle{animation:tw 4s ease-in-out infinite}.home-stars circle:nth-child(3n){animation-delay:-1.3s}.home-stars circle:nth-child(5n){animation-delay:-2.6s}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.home-title{margin:0;font-size:clamp(1.8rem,6vw,3.2rem);letter-spacing:.12em;font-family:inherit;color:#fff}
.home-sub{margin:0;color:#9aa8d8;letter-spacing:.2em;font-size:.85rem;text-transform:uppercase}
.solar{width:min(100%,62vh,640px);height:auto;display:block}
.home-order{margin:0;color:#7e8ab8;font-size:.72rem;letter-spacing:.08em}
.home-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.hbtn{font-family:Audiowide,"Times New Roman",serif;font-weight:400;font-size:1.05rem;letter-spacing:.08em;padding:12px 26px;border-radius:999px;background:#000;border:2px solid #60a5fa;color:#eaf0ff;box-shadow:0 0 18px #60a5fa55}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:#1b1200;box-shadow:0 0 22px #ffb34777}
.hbtn:hover:not(:disabled){transform:translateY(-2px)}
.home-info{margin:0;color:#9aa8d8;font-size:.85rem}
body.home{background:#000}body.home header{display:none}
@media(prefers-reduced-motion:reduce){.home-stars circle{animation:none}}
.scene{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block;margin:8px 0}
.streak{animation:drift 1.3s linear infinite}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(880px)}}
@media(prefers-reduced-motion:reduce){.streak{animation:none}}
@media(max-width:600px){main{padding:10px}.stages div{font-size:.7rem}}
body.wide main{max-width:1280px}
.play{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px;align-items:start}
.stage{position:relative}
#wc{width:100%;max-width:none;height:auto;aspect-ratio:900/540;border:1px solid var(--line);border-radius:12px;background:#0a0d1c;display:block;touch-action:none;cursor:pointer}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.dpad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(2,36px);gap:4px}
.dpad button{padding:0;touch-action:none}#dU{grid-column:2}#dL{grid-column:1;grid-row:2}#dD{grid-column:2;grid-row:2}#dR{grid-column:3;grid-row:2}
.pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,380px);max-height:80%;overflow:auto;background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:12px;z-index:3;box-shadow:0 10px 40px #000a}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:8px 0}
.tabsrow{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.sidelist{max-height:340px;overflow:auto;padding-right:2px}
.sidelist .opt{margin:4px 0;padding:6px 10px}
@media(max-width:900px){.play{grid-template-columns:1fr}.side{position:static}}
</style>
</head>

 cadet:{n:"Cadet",icon:"🌱",tag:"Ages 6–9 · gentle",desc:"Slower supply drain, milder events, 8 energy a day, tips, and a wide landing pad.",dr:.6,sev:.6,en:8,pad:1.3,vy:4,hints:true},

const ACT = [
 ["Watch the sky (sunset or Earth)",1,0,1,1,"From the Moon's near side Earth hangs in nearly the same spot forever because the Moon is tidally locked."],
 ["Brush dust off solar panels",1,0,2,1,"Dust on Opportunity's panels cut its power until a storm ended the mission. Brushing keeps energy flowing."],
 ["Picture studied in rocket",1,0,1,1,"Orbiter photos show craters; shadows are used to work out how deep they are."],
 ["Stargaze through the rocket telescope",1,2,1,1,"With no air, stars do not twinkle on the Moon. They look steady and sharp."],
 ["Exercise to protect bones and muscles",1,0,2,1,"Astronauts exercise about 2 hours a day. Low gravity makes bones lose density."],
 ["Read your radiation badge",1,1,2,1,"There is no thick air or magnetic field on the Moon, so radiation is higher than on Earth."],
 ["Measure plant growth",2,4,2,1,"Plants help recycle air and could become fresh food on long missions."],
 ["Check the reactor heat output",2,3,2,1,"Nuclear batteries turn heat into electricity. Curiosity's makes about 110 W, like a light bulb."],
 ["Measure the ground temperature",1,1,2,1,"The lunar surface swings from about 120 °C in daylight to about -170 °C at night."],

 ["Measure an impact crater",2,2,2,1,"Crater size and shape tell scientists how big the impact was and how old the surface is."],

 ["Collect volcanic glass beads",2,3,3,2,"Apollo 17 found orange glass beads from lava fountains about 3.6 billion years ago."],

function starsSVG(n,w,h,seed){let x=seed,o="";for(let i=0;i<n;i++){x=(x*9301+49297)%233280;const a=x/233280;x=(x*9301+49297)%233280;const b=x/233280;o+=`<circle cx="${(a*w).toFixed(0)}" cy="${(b*h*.65).toFixed(0)}" r="${(.4+b).toFixed(1)}" fill="#fff" opacity="${(.3+a*.6).toFixed(2)}"/>`}return o}

  o+=`<rect width="${W}" height="${H}" fill="url(#${id}s)"/>`+starsSVG(70,W,H,mars?7:3);
  if(!mars)o+=`<circle cx="${W-90}" cy="55" r="26" fill="url(#${id}e)"/><path d="M${W-104},48 q10,-8 16,2 q-6,10 -16,-2z M${W-92},66 q10,-4 14,4 q-8,6 -14,-4z" fill="#4ade80" opacity=".7"/>`;

  o+=`<path d="M0,${gy-30} Q120,${gy-70} 260,${gy-25} T520,${gy-35} T${W},${gy-30} V${H} H0Z" fill="${g2}"/>`;
  o+=`<rect x="0" y="${gy}" width="${W}" height="${H-gy}" fill="${g1}"/><path d="M0,${gy} H${W}" stroke="${g3}" stroke-width="2"/>`;

  else if(TAB==="supplies")body=`<p class="small muted">Order a crate from Mission Control with Science Points. It lands on the pad outside. You have <b>${S.sp} SP</b>.</p>`+SUP.map((s,i)=>`<button class="opt" ${S.sp<s.cost&&!free?"disabled":""} onclick="buySup(${i})">${esc(s.n)} <span class="tag">${free?"free":s.cost+" SP"}</span><span class="ctx">${esc(s.ctx)}</span></button>`).join("")+(S.crates.length?`<p class="small"><b>Crates waiting on the pad:</b></p>`+S.crates.map((i,k)=>`<button class="opt" onclick="goCrate(${k})">📦 ${esc(SUP[i].n)} <span class="ctx">Walk to the landing pad and open it.</span></button>`).join(""):"")+`<button class="opt" ${S.energy<1?"disabled":""} onclick="goQuiz()">❓ Mission Control quiz <span class="tag">⚡1</span><span class="ctx">Walk to the comms console and answer questions for Science Points.</span></button>`;
  else{const dr=MD().dr,gen=Math.round(36*(1-S.dust/100)),use=Math.round(8*dr);body=`<div class="small"><p><b>Tonight's forecast</b></p><p>☀️ Solar today: +${gen} power, base use −${use}. Panels ${S.dust}% dusty.</p><p>🌙 Night uses about 🫧 −${Math.round(7*dr)} 💧 −${Math.round(6*dr)} 🍲 −${Math.round(5*dr)} ⚡ −${Math.round(26*dr)}.</p><p>🛡️ Shelter armor: ${S.armor}/3 · 🧤 Suit dust: ${Math.round(S.suitDust)}% · Cabin dust: ${Math.round(S.cabinDust)}%</p><p>🌙 Nights survived: ${S.day-1} of 7 · ⭐ ${S.sp} SP</p><p class="muted">The Six Lost Outposts: dead by CO₂, dust storm, solar flare, meteorite, cold and despair. Do not be number seven.</p></div>`+(free?`<button class="sm" onclick="S.res={o2:100,water:100,food:100,power:100,health:100,morale:100};S.dust=0;S.cabinDust=0;save();refresh()">🧪 Refill all</button>`:"")+(S.log.length?`<div class="log" style="margin-top:8px">${S.log.map(l=>`<p>${esc(l)}</p>`).join("")}</div>`:"")}
  el.innerHTML=`<div class="row spread"><b>🌑 Day ${S.day} of 7</b><span class="chip">⚡ Energy ${S.energy}</span></div><div class="grid2">${RES.map(r=>`<div>${barH(r[1]+" "+r[2],S.res[r[0]],100)}</div>`).join("")}</div>${tip()}<div class="row tabsrow">${tabs.map(t=>`<button class="sm ${TAB===t[0]?"primary":""}" onclick="TAB='${t[0]}';renderSide()">${t[1]}</button>`).join("")}</div><div class="sidelist">${body}</div><button class="primary" style="width:100%;margin-top:8px" onclick="goBed()">🛏️ Go to bed (end day)</button>`;
}
function doChore(id){const c=CH.find(x=>x.id===id);if(S.energy<c.e){toast("Not enough energy. Go to bed to end the day.");return}S.energy-=c.e;let t=applyFx(c.fx,0);if(OUTCH[id]){S.res.o2=clamp(S.res.o2-3);S.suitDust=clamp(S.suitDust+25);t+="  🫧 -3 (suit)"}log(c.icon+" "+c.n+(t?" → "+t:""));toast(c.fact);save();refresh()}
function doSci(i){const a=ACT[i],pc=Math.ceil(a[2]/4);if(S.done[i]||S.energy<a[1])return;S.energy-=a[1];S.res.power=clamp(S.res.power-pc);S.res.morale=clamp(S.res.morale+2);if(isOutSci(a)){S.res.o2=clamp(S.res.o2-3);S.suitDust=clamp(S.suitDust+25)}S.done[i]=1;const pts=actPts(a);S.sp+=pts;log("🔬 "+a[0]+" → +"+pts+" SP");toast("+"+pts+" SP: "+a[5]);save();refresh()}
function buySup(i){const s=SUP[i],free=MD().free;if(!free&&S.sp<s.cost)return;if(!free)S.sp-=s.cost;S.crates.push(i);log("📦 Ordered "+s.n+". It lands on the pad.");toast("A crate is landing at the pad outside!");save();refresh()}

function endDay(){
  P.path=[];P.pending=null;closePop();
  const dr=MD().dr,r=S.res,gen=Math.round(36*(1-S.dust/100)),use=Math.round(8*dr);
  r.o2-=Math.round(7*dr);r.water-=Math.round(6*dr);r.food-=Math.round(5*dr);r.power+=gen-use;r.health-=Math.round(2*dr);r.morale-=2;
  log("☀️ Day "+S.day+" ends: solar gave +"+gen+" power ("+S.dust+"% dust) minus "+use+" used.");
  S.dust=clamp(S.dust+12);clampRes();
  const pool=EV.filter(e=>!S.seen.includes(e.id));const list=pool.length?pool:EV;
  const e=list[Math.floor(rnd()*list.length)];S.seen=pool.length?S.seen.concat(e.id):[e.id];
  S.ev={id:e.id,chosen:null,fx:""};S.phase="event";save();go("event")}
/* ============ EVENT & NIGHT ============ */
function renderEvent(){
  const e=EV.find(x=>x.id===S.ev.id),ch=S.ev.chosen;
  let b=`<div class="card"><h2>${e.icon} Night ${S.day}: ${e.title}</h2>${baseScene(true)}<p>${esc(e.text)}</p>${LOSTEV[e.id]?`<p class="small bad">🕯️ This hazard killed the crew of Outpost ${LOSTEV[e.id]}.</p>`:""}`;
  if(ch===null)b+=`<p class="muted small">Choose one. No option is perfect.</p>`+e.opts.map((o,i)=>`<button class="opt" onclick="chooseOpt(${i})">${esc(o.l)}<span class="ctx">${esc(o.ctx)}</span></button>`).join("");
  else b+=`<p><b>You chose:</b> ${esc(e.opts[ch].l)}</p><p class="${S.ev.fx?"":"muted"}">${S.ev.fx||"No change."}</p><div class="debrief"><b>${esc(e.real[0])}</b><br>${esc(e.real[1])}</div><button class="primary" onclick="toNight()">Continue into the night →</button>`;
  return b+`</div>`+`<div class="card">${resBars()}</div>`}
function chooseOpt(i){const e=EV.find(x=>x.id===S.ev.id),o=e.opts[i];S.ev.chosen=i;S.ev.fx=applyFx(o.fx,MD().sev,e.prot);S.evLog.push(e.id);log(e.icon+" "+e.title+": "+o.l);save();render()}
function toNight(){resolveNight();S.phase=S.over?"end":"night";save();go("night")}
function resolveNight(){
  const m=MD(),dr=m.dr,r=S.res,L=[];
  const d={o2:Math.round(7*dr),water:Math.round(6*dr),food:Math.round(5*dr),power:Math.round(26*dr)};
  r.o2-=d.o2;r.water-=d.water;r.food-=d.food;r.power-=d.power;r.morale-=3;
  L.push(`Night uses: 🫧 -${d.o2}  💧 -${d.water}  🍲 -${d.food}  ⚡ -${d.power} (heaters)  🙂 -3`);
  let cause=null;
  if(S.cabinDust>0){const h=Math.round(S.cabinDust/15*m.sev);if(h>0){r.health-=h;L.push('🧤 Moon dust inside the cabin irritated your lungs: health -'+h)}S.cabinDust=0}
  if(r.power<0){r.power=0;r.health-=30;L.push("❄️ Power ran out and the heaters switched off. The habitat froze: health -30.");cause="power"}
  if(r.water<=0){r.water=0;r.health-=25;L.push("🏜️ Out of water: health -25.");cause="water"}
  if(r.food<=0){r.food=0;r.health-=15;L.push("🍽️ Out of food: health -15.");cause="food"}
  if(r.morale<=0){r.morale=0;r.health-=10;L.push("😞 Morale hit zero: health -10.");cause="morale"}
  if(r.o2<=0){r.o2=0;L.push("🫧 The oxygen ran out.");S.over={win:false,cause:"o2",why:"oxygen"}}
  if(r.health<=0&&!S.over){S.over={win:false,cause:"health",why:cause||"health"}}
  if(m.free){S.over=null;for(const k in r)r[k]=Math.max(r[k],k==="health"?10:5)}
  clampRes();
  if(!S.over){if(S.day>=7){S.over={win:true};S.sp+=50;L.push("🌅 Dawn on night 7. You survived! +50 SP")}
    else{S.day++;const lowM=r.morale<25?1:0;S.energy=Math.max(2,m.en-S.penalty-lowM);if(lowM)L.push("😞 Low morale: 1 less energy tomorrow.");if(S.penalty)L.push("🔧 Repairs from the event: -"+S.penalty+" energy tomorrow.");S.penalty=0}}
  S.report=L;log("🌙 Night "+(S.over&&!S.over.win?S.day:S.day-(S.over?0:1))+" complete.")}
function renderNight(){
  return `<div class="card"><h2>🌙 Night ${S.day-1} report</h2>${baseScene(true)}<div class="log" style="max-height:none">${S.report.map(l=>`<p>${esc(l)}</p>`).join("")}</div></div><div class="card">${resBars()}<button class="primary" onclick="startDay()">☀️ Start Day ${S.day} →</button></div>`}
function renderEnd(){
  const o=S.over,evs=[...new Set(S.evLog)].map(id=>EV.find(e=>e.id===id)),cards=evs.map(e=>`<div class="debrief"><b>${e.icon} ${esc(e.real[0])}</b><br>${esc(e.real[1])}</div>`).join("");
  if(o.win)return `<div class="card"><h2>🏅 You survived 7 nights!</h2><p class="good">You are the first crew to outlast the Six Lost Outposts.</p>${baseScene(false)}<p>Outpost 7 is still running. Oxygen ${S.res.o2}, water ${S.res.water}, food ${S.res.food}, power ${S.res.power}, health ${S.res.health}, morale ${S.res.morale}.</p><p class="good"><b>Science Points: ${S.sp}</b> (includes +50 for surviving)</p><h3>The real missions behind your nights</h3>${cards||"<p class='muted'>No events recorded.</p>"}<div class="row" style="margin-top:10px"><button class="primary" onclick="go('modes')">Play again</button><button onclick="go('home')">Home</button></div></div>`;
  const f=FAIL[o.cause]||FAIL.health;
  return `<div class="card"><h2>💥 Outpost 7 was lost on night ${S.day}</h2>${baseScene(true)}<p><b>${esc(f[0])}.</b> ${esc(f[1])}</p><p class="muted">Cause chain: ${esc(o.why)}.</p><h3>What the real missions teach</h3>${cards||"<p class='muted'>No events recorded.</p>"}<div class="row" style="margin-top:10px"><button class="primary" onclick="pickMode('${S.mode}')">Try again</button><button onclick="go('modes')">Change mode</button><button onclick="go('home')">Home</button></div></div>`}
/* ============ MODES SCREEN ============ */
function modes(){
  return '<div class="card"><h2>Choose your training mode</h2><p class="muted">Survive 7 nights at Outpost 7. '+(S.mode&&S.phase!=="home"?'Starting a new outpost erases your current one.':'Pick how tough Mission Control should be.')+'</p></div><div class="grid">'+
   Object.keys(MODES).map(k=>{const m=MODES[k];return '<div class="card" style="margin:0"><h3>'+m.icon+' '+m.n+'</h3><p class="small muted">'+m.tag+'</p><p class="small">'+esc(m.desc)+'</p><button class="primary" onclick="pickMode(\''+k+'\')">Start '+m.n+'</button></div>'}).join("")+'</div><div class="row" style="margin-top:12px"><button onclick="go(\'home\')">🏠 Home</button></div>';
}
/* ============ QUIZ ============ */
function startQuiz(){if(S.energy<1)return;S.energy--;S.res.morale=clamp(S.res.morale+3);save();Q={qs:[...QUIZ].sort(()=>rnd()-.5).slice(0,5),i:0,right:0,picked:null,pts:0};go("quiz")}
function renderQuiz(){
  if(Q.i>=Q.qs.length)return '<div class="card"><h2>Quiz complete!</h2><p>You got <b>'+Q.right+'/'+Q.qs.length+'</b> and earned <b>'+Q.pts+' SP</b>.</p><button class="primary" onclick="TAB=\'supplies\';go(\'base\')">Back to the outpost</button></div>';
  const q=Q.qs[Q.i];
  return '<div class="card"><div class="row spread"><h2>❓ Quiz '+(Q.i+1)+'/'+Q.qs.length+'</h2></div><p><b>'+esc(q.q)+'</b></p>'+
   q.a.map((x,j)=>'<button class="opt '+(Q.picked!==null&&j===q.c?'sel':'')+'" '+(Q.picked!==null?'disabled':'')+' onclick="answerQ('+j+')">'+esc(x)+'</button>').join("")+
   (Q.picked!==null?'<div class="debrief">'+(Q.picked===q.c?'<b class="good">Correct! +'+q.v+' SP</b>':'<b class="bad">Not quite.</b>')+' '+esc(q.e)+'</div><button class="primary" onclick="Q.i++;Q.picked=null;render()">Next →</button>':'')+'</div>';
}
function answerQ(j){const q=Q.qs[Q.i];Q.picked=j;if(j===q.c){Q.right++;Q.pts+=q.v;S.sp+=q.v;save()}render()}

/* ============ LORE: SIX LOST OUTPOSTS ============ */
const LOST=[
 {n:1,night:2,cause:"The oxygen scrubbers failed and carbon dioxide built up in the cabin.",ev:"co2"},
 {n:2,night:3,cause:"A dust storm buried the solar panels. The power ran out and the heaters stopped.",ev:"dust"},
 {n:3,night:4,cause:"A solar flare hit while the crew was working outside the shelter.",ev:"flare"},
 {n:4,night:3,cause:"A micrometeorite punched through the wall while the crew slept.",ev:"meteor"},
 {n:5,night:6,cause:"The heaters failed during the coldest hours of the lunar night.",ev:"cold"},
 {n:6,night:5,cause:"Supplies ran thin and the crew lost hope. Exhaustion led to fatal mistakes.",ev:"homesick"}
];
const LOSTEV={co2:1,dust:2,flare:3,meteor:4,cold:5,homesick:6,recycler:6};
function renderLore(){
  return `<div class="card"><h2>📜 Outpost 7: mission briefing</h2><p class="muted">In this story, six lunar outposts were built before yours. Every crew was lost within the first week. Mission Control calls this the Six Lost Crews.</p>
  <div class="grid">${LOST.map(l=>`<div class="card" style="margin:0"><h3>🕯️ Outpost ${l.n}</h3><p class="small muted">Lost on night ${l.night}</p><p class="small">${esc(l.cause)}</p></div>`).join("")}</div>
  <p>Outpost 7 is yours. <b>Survive 7 nights.</b> Keep oxygen, water, food, power, health and morale above zero, and learn from the six crews who came before you.</p>
  <button class="primary" onclick="go('landing')">🛬 Begin the landing →</button></div>`}
/* ============ LANDING ============ */
function renderLanding(){
  return `<div class="card"><h2>🛬 Land Outpost 7</h2><p class="muted small">Put the seventh outpost down gently on the flat green pad: vertical speed under ${MD().vy} m/s and sideways under 2 m/s. Controls: ↑/Space = main engine, ←/→ = side thrusters (or use the buttons). A soft landing keeps every supply safe. A hard landing damages supplies, but you still survive.</p>
  <canvas id="cv" width="700" height="420"></canvas>
  <div class="row" style="margin-top:8px"><button id="bL">◀</button><button id="bU">▲ Thrust</button><button id="bR">▶</button><button class="primary" id="bGo" onclick="newLanding()">Start landing</button><button class="sm" onclick="skipLanding()">Skip landing</button></div><div id="res"></div></div>`}
function skipLanding(){S.arrival="skip";S.phase="day";save();go("base")}
function initLanding(){
  const bind=(id,k)=>{const b=$("#"+id);b.addEventListener("pointerdown",e=>{KEY[k]=true;e.preventDefault()});["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>KEY[k]=false))};
  bind("bL","l");bind("bU","u");bind("bR","r");
  const pw=Math.round(100*MD().pad);
  LND={pw,stop:false,state:"ready",c:$("#cv"),pad:150+rnd()*400};
  const pts=[];for(let x=0;x<=700;x+=25){let y=355;if(Math.abs(x-LND.pad)>pw/2+8)y=345+Math.sin(x*.07+LND.pad)*14+rnd()*10;pts.push([x,y])}
  LND.terr=pts;
  LND.ground=x=>{if(Math.abs(x-LND.pad)<=pw/2)return 355;const i=Math.max(0,Math.min(pts.length-2,Math.floor(x/25)));const t=(x-pts[i][0])/25;return pts[i][1]*(1-t)+pts[i+1][1]*t};
  LND.L={x:100,y:40,vx:0,vy:0,fuel:100};
  drawLanding(LND);
}
function newLanding(){
  if(!LND||LND.state!=="ready")return;
  $("#res").innerHTML="";LND.state="flying";LND.L={x:80+rnd()*540,y:30,vx:(rnd()-.5)*40,vy:0,fuel:100};
  let last=performance.now();const me=LND;
  (function loop(now){
    if(me.stop)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    const L=me.L;let ax=0,ay=16;
    if(L.fuel>0){if(KEY.u){ay-=30;L.fuel-=10*dt}if(KEY.l){ax-=22;L.fuel-=4*dt}if(KEY.r){ax+=22;L.fuel-=4*dt}}
    L.vx+=ax*dt;L.vy+=ay*dt;L.x+=L.vx*dt;L.y+=L.vy*dt;
    me.dust=KEY.u&&L.y>260?(me.dust||0)+1:0;
    drawLanding(me);
    const gy=me.ground(L.x);
    if(L.x<0||L.x>700){me.state="done";endLanding(false,"The lander drifted away from the landing zone.");return}
    if(L.y+12>=gy){me.state="done";
      const onPad=Math.abs(L.x-me.pad)<=me.pw/2-6,vy=L.vy/10,vx=Math.abs(L.vx)/10;
      if(!onPad)endLanding(false,"You touched down off the flat pad. Rocks and slopes can tip a lander over.");
      else if(vy>MD().vy)endLanding(false,"Too fast! Touchdown at "+vy.toFixed(1)+" m/s damaged the lander.");
      else if(vx>2)endLanding(false,"Too much sideways drift ("+vx.toFixed(1)+" m/s) tipped the lander.");
      else endLanding(true,"Soft touchdown at "+vy.toFixed(1)+" m/s with "+Math.round(L.fuel)+"% fuel left.");
      return}
    requestAnimationFrame(loop);
  })(last);
}
function endLanding(ok,msg){
  S.arrival=ok?"soft":"hard";
  if(!ok){S.res.o2-=15;S.res.power-=20;S.res.health-=10;clampRes()}
  S.phase="day";save();
  $("#res").innerHTML=`<div class="debrief"><b class="${ok?"good":"bad"}">${ok?"Soft landing! All supplies are safe.":"Hard landing. Oxygen -15, power -20, health -10."}</b><br>${esc(msg)}</div><button class="primary" onclick="go('base')">Begin Night 1 →</button>`;
  const b=$("#bGo");if(b)b.style.display="none";
}
/* ============ HOME ============ */
function renderHome(){
  const has=!!S.mode&&S.phase!=="home",info=has?`${MD().icon} ${MD().n} · Night ${Math.min(S.day,7)} of 7 · ${S.sp} SP`:"No saved outpost yet";
  return `<div class="home-wrap"><svg class="home-stars" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${starsSVG(160,1000,1500,11)}${starsSVG(80,1000,1500,29)}</svg>
   <h1 class="home-title">OUTPOST 7</h1><p class="home-sub">Six crews were lost. Survive 7 nights.</p>
   ${home()}
   <p class="home-order">Mercury · Venus · Earth · Mars · Jupiter · Saturn · Uranus · Neptune</p>
   <div class="home-btns"><button class="hbtn primary" onclick="go('modes')">🚀 New Outpost</button><button class="hbtn" ${has?"":"disabled"} onclick="resume()">Continue Outpost</button></div>
   <p class="home-info">${esc(info)}</p></div>`}
/* ============ RENDER ============ */
function chips(){$("#chips").innerHTML=S.mode?`<span class="chip">${MD().icon} ${MD().n}</span><span class="chip">🌙 Night ${Math.min(S.day,7)}/7</span><span class="chip">⭐ ${S.sp} SP</span>`:""}
function render(){
  chips();stopLanding();stopLoop();document.body.classList.toggle("home",V==="home");document.body.classList.toggle("wide",V==="base");
  const f={home:renderHome,modes,lore:renderLore,landing:renderLanding,base:renderBase,event:renderEvent,night:renderNight,end:renderEnd,quiz:renderQuiz}[V];
  $("#app").innerHTML=f();if(V==="landing")initLanding();if(V==="base")initWorld();
}
V="home";render();

</script>
</body>
</html>
