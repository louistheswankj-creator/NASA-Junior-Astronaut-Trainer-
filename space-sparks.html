<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Sparks – Junior Astronaut Mission Trainer</title>
<style>
:root{--bg:#070b1f;--panel:#111a3d;--panel2:#1a2656;--text:#eaf0ff;--muted:#9aa8d8;--accent:#ffb347;--good:#4ade80;--bad:#f87171;--blue:#60a5fa;--line:#2b3a78}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#16215a 0,#070b1f 60%) fixed;color:var(--text);font:16px/1.55 "Times New Roman",Times,serif;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(7,11,31,.85);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.15rem;letter-spacing:.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.85rem}
main{max-width:1000px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:"Times New Roman",Times,serif;letter-spacing:0}h2{margin:.2em 0 .4em}h3{margin:.2em 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
button{font:inherit;font-weight:700;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:#1b1200;border-color:var(--accent);font-weight:700}
button.sm{padding:4px 10px;font-size:.85rem}
.muted{color:var(--muted)}.small{font-size:.85rem}
.good{color:var(--good)}.bad{color:var(--bad)}
.opt{display:block;text-align:left;width:100%;margin:6px 0}
.opt.sel{border-color:var(--accent);background:#2a2f63}
.opt .ctx{display:block;color:var(--muted);font-size:.85rem}
.bar{height:12px;background:#0a1030;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--good);transition:width .3s}
.bar.warn>i{background:var(--accent)}.bar.danger>i{background:var(--bad)}.bar.blue>i{background:var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.stages{display:flex;gap:8px;margin:6px 0}
.stages div{flex:1;text-align:center;padding:6px;border-radius:8px;border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.stages .on{border-color:var(--accent);color:var(--text);background:#2a2f63}.stages .done{color:var(--good);border-color:var(--good)}
.map{position:relative;height:90px;margin:14px 6px 24px;border-bottom:3px dashed var(--line)}
.map .pt{position:absolute;bottom:-4px;transform:translateX(-50%);text-align:center;font-size:.75rem}
.map .pt span{display:block;font-size:1.4rem}
.map .rv{position:absolute;bottom:22px;transform:translateX(-50%);font-size:1.8rem;transition:left .5s}
.log{max-height:170px;overflow:auto;background:#0a1030;border-radius:10px;padding:8px 12px;font-size:.9rem}
.log p{margin:2px 0}.log .ev{color:var(--accent)}.log .er{color:var(--bad)}.log .ok{color:var(--good)}
.debrief{border-left:4px solid var(--accent);background:#0f1740;padding:10px 14px;border-radius:0 10px 10px 0;margin:8px 0}
canvas{width:100%;max-width:700px;background:#02040f;border:1px solid var(--line);border-radius:10px;display:block;touch-action:none}
select{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--accent);color:#1b1200;font-weight:700;padding:8px 18px;border-radius:999px;z-index:9;box-shadow:0 4px 20px #0008}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:4px;color:var(--muted)}
table{width:100%;border-collapse:collapse}td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
.scene{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block;margin:8px 0}
.streak{animation:drift 1.3s linear infinite}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(880px)}}
@media(prefers-reduced-motion:reduce){.streak{animation:none}}
@media(max-width:600px){main{padding:10px}.stages div{font-size:.7rem}}
</style>
</head>

function toast(msg){const t=$("#toast");t.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML="",2800)}
function award(pts,why){S.sp+=pts;const f=fund(pts);S.budget+=f;toast("+"+pts+" Science Points ("+why+") · +$"+f+"M funding");checkUnlocks();save()}
function checkUnlocks(){for(const k in ROVERS){const r=ROVERS[k];if(r.unlock>0&&S.sp>=r.unlock&&!S.rovers[k]){S.rovers[k]=1;toast("Unlocked rover: "+r.n)}}}
function grantIfBroke(){if(S.budget<40){S.budget+=60;toast("Mission Control approves a $60M recovery grant. Try a different design!")}}
function go(v){V=v;render();window.scrollTo(0,0)}

/* ============ VISUALS ============ */
const SCOL={anorthosite:"#dfe2ee",basalt:"#3b3b4c",breccia:"#8d7058",regolith:"#a39c8c","volcanic basalt":"#5d3a36","sedimentary rock":"#b9794f",meteorite:"#6a7180","clay mudstone":"#cb9270"};
function rockG(t,got){
  const c=SCOL[t]||"#888";
  let o=got?`<polygon points="4,32 10,14 24,6 40,12 45,32" fill="${c}" stroke="#fff" stroke-opacity=".35"/>`:`<polygon points="4,32 10,14 24,6 40,12 45,32" fill="none" stroke="#9aa8d8" stroke-opacity=".6" stroke-dasharray="3 3"/><text x="24" y="26" text-anchor="middle" font-size="14" style="fill:var(--muted)">?</text>`;
  if(got){
    if(t==="breccia")o+=`<circle cx="16" cy="22" r="2.5" fill="#d9c6b0"/><circle cx="28" cy="18" r="3" fill="#5b4636"/><circle cx="34" cy="26" r="2" fill="#d9c6b0"/>`;
    if(t==="sedimentary rock")o+=`<path d="M8,22H43M7,27H44" stroke="#7a4b2e" stroke-width="2"/>`;
    if(t==="meteorite")o+=`<path d="M14,14 L30,10" stroke="#c9d1e6" stroke-width="2" opacity=".7"/>`;
    if(t==="anorthosite")o+=`<path d="M12,22 L22,12" stroke="#fff" stroke-width="2" opacity=".6"/>`;
    if(t==="regolith")o+=`<circle cx="14" cy="26" r="1.5" fill="#6d675b"/><circle cx="26" cy="22" r="1.5" fill="#6d675b"/><circle cx="36" cy="27" r="1.5" fill="#6d675b"/>`;
  }
  return o}
function rocksRow(wk){const store=S.samples[wk];return `<p class="small muted">${WORLDS[wk].n}: ${Object.keys(store).length}/4</p><div class="row">`+WORLDS[wk].types.map(t=>`<div style="text-align:center"><svg viewBox="0 0 48 36" width="54" height="40" aria-hidden="true">${rockG(t,!!store[t])}</svg><div class="small">${store[t]?esc(t):"???"}</div></div>`).join("")+`</div>`}
function starsSVG(n,w,h,seed){let x=seed,o="";for(let i=0;i<n;i++){x=(x*9301+49297)%233280;const a=x/233280;x=(x*9301+49297)%233280;const b=x/233280;o+=`<circle cx="${(a*w).toFixed(0)}" cy="${(b*h*.65).toFixed(0)}" r="${(.4+b).toFixed(1)}" fill="#fff" opacity="${(.3+a*.6).toFixed(2)}"/>`}return o}
function skyGround(W,H,gy,mars,id){
  const sk=mars?["#241426","#7a4538"]:["#02040f","#18245a"],g1=mars?"#7d3f30":"#5c6082",g2=mars?"#4a261e":"#363a5c",g3=mars?"#9a5440":"#7a7fa3";
  let o=`<defs><linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sk[0]}"/><stop offset="1" stop-color="${sk[1]}"/></linearGradient><radialGradient id="${id}e" cx=".35" cy=".35"><stop offset="0" stop-color="#9fd0ff"/><stop offset="1" stop-color="#1e4fa8"/></radialGradient></defs>`;
  o+=`<rect width="${W}" height="${H}" fill="url(#${id}s)"/>`+starsSVG(70,W,H,mars?7:3);
  if(!mars)o+=`<circle cx="${W-90}" cy="55" r="26" fill="url(#${id}e)"/><path d="M${W-104},48 q10,-8 16,2 q-6,10 -16,-2z M${W-92},66 q10,-4 14,4 q-8,6 -14,-4z" fill="#4ade80" opacity=".7"/>`;
  else o+=`<circle cx="${W-120}" cy="50" r="5" fill="#cbb7a0"/><circle cx="${W-90}" cy="70" r="3" fill="#cbb7a0"/>`;
  o+=`<path d="M0,${gy-30} Q120,${gy-70} 260,${gy-25} T520,${gy-35} T${W},${gy-30} V${H} H0Z" fill="${g2}"/>`;
  o+=`<rect x="0" y="${gy}" width="${W}" height="${H-gy}" fill="${g1}"/><path d="M0,${gy} H${W}" stroke="${g3}" stroke-width="2"/>`;
  for(let i=0;i<7;i++){const cx=(i*137+60)%W,cy=gy+14+(i%3)*12;o+=`<ellipse cx="${cx}" cy="${cy}" rx="${22+i%3*8}" ry="${5+i%3*2}" fill="#000" opacity=".18"/>`}
  return o}
function roverSVG(o){
  const dust=o.dust||0,wh=o.wheel===undefined?100:o.wheel;let s="";
  if(o.crew){
    s+=`<rect x="-26" y="-14" width="52" height="5" fill="#9aa3bf"/><rect x="-14" y="-22" width="9" height="9" fill="#c9cde0"/><rect x="6" y="-22" width="9" height="9" fill="#c9cde0"/>`;
    [-9,11].forEach(x=>{s+=`<circle cx="${x}" cy="-34" r="4.5" fill="#fff" stroke="#9aa3bf"/><rect x="${x-4}" y="-30" width="8" height="10" rx="2" fill="#f1f3fb"/>`});
    s+=`<path d="M22,-14 L30,-34" stroke="#cbd0e6" stroke-width="1.5"/><path d="M24,-40 Q32,-46 40,-38 Z" fill="#e5e7eb"/>`;
    [-20,20].forEach(x=>{s+=`<circle cx="${x}" cy="-6" r="7" fill="#222" stroke="#aab" stroke-width="2"/>`});
    return s}
  s+=`<rect x="-22" y="-24" width="44" height="13" rx="3" fill="#cfd3e6"/>`;
  if(o.power==="nuclear")s+=`<rect x="14" y="-34" width="12" height="12" rx="2" fill="#7b8294"/><path d="M12,-30 h2 M12,-26 h2 M26,-30 h2 M26,-26 h2" stroke="#d6dae8" stroke-width="1.5"/><circle cx="20" cy="-28" r="2" fill="#fbbf24"/>`;
  else s+=`<path d="M-30,-27 L-14,-32 L30,-32 L30,-27 Z" fill="#2563eb"/><path d="M-30,-27 L-14,-32 L30,-32 L30,-27 Z" fill="#a9834f" opacity="${Math.min(.9,dust/110).toFixed(2)}"/><path d="M-14,-32 V-27 M0,-32 V-27 M14,-32 V-27" stroke="#93c5fd" stroke-width=".8"/>`;
  s+=`<path d="M-10,-24 V-40" stroke="#cbd0e6" stroke-width="2"/><rect x="-14" y="-45" width="9" height="6" fill="#e5e7eb"/><circle cx="-12" cy="-42" r="1.5" fill="#222"/>`;
  if(o.tools)s+=`<path d="M22,-17 L34,-22 L38,-14" stroke="#cbd0e6" stroke-width="2" fill="none"/><circle cx="38" cy="-13" r="2.5" fill="#fbbf24"/>`;
  for(let i=0;i<6;i++){const x=-20+i*8,bad=wh<60&&i<2;s+=`<circle cx="${x}" cy="-5" r="5" fill="#1b1f33" stroke="${wh<=0?"#f87171":bad?"#fb923c":"#9aa3bf"}" stroke-width="1.5"/>`}
  return s}
function landerSVG(){return `<path d="M-20,-6 L-34,0 M20,-6 L34,0" stroke="#cbd0e6" stroke-width="2.5"/><path d="M-16,-34 L16,-34 L22,-12 L-22,-12Z" fill="#e5e7eb"/><rect x="-22" y="-12" width="44" height="8" fill="#d6a23a"/><circle cx="0" cy="-24" r="5" fill="#60a5fa"/><path d="M-6,-4 L-9,2 H9 L6,-4Z" fill="#555"/>`}
function habSVG(){return `<path d="M-40,0 A40,40 0 0 1 40,0Z" fill="#aab4d0"/><rect x="40" y="-22" width="26" height="22" fill="#8d96a3"/><circle cx="0" cy="-18" r="5" fill="#60a5fa"/><path d="M0,-40 V-58 M-8,-52 H8" stroke="#cbd0e6" stroke-width="2"/><rect x="74" y="-40" width="20" height="40" rx="7" fill="#aab4d0"/><rect x="77" y="-18" width="14" height="16" rx="3" fill="#4aa8ff"/>`}
function hubScene(){
  const W=800,H=190,gy=150,st=S.stage;
  let o=`<svg viewBox="0 0 ${W} ${H}" class="scene" role="img" aria-label="Your lunar outpost so far">`+skyGround(W,H,gy,false,"h");
  o+=`<g transform="translate(130,${gy}) scale(1.2)">${roverSVG({power:"solar",tools:true})}</g>`;
  WORLDS.moon.types.forEach((t,i)=>{o+=`<g transform="translate(${215+i*42},${gy-26}) scale(.8)">${rockG(t,!!S.samples.moon[t])}</g>`});
  if(st>=2)o+=`<g transform="translate(450,${gy})">${landerSVG()}</g><path d="M520,${gy} V${gy-42}" stroke="#ddd" stroke-width="2"/><rect x="520" y="${gy-42}" width="24" height="15" fill="#2563eb"/>`;
  if(st>=4)o+=`<g transform="translate(630,${gy})">${habSVG()}</g>`;
  else if(st===3)o+=`<g transform="translate(630,${gy})" opacity=".6" fill="none" stroke="#9aa8d8" stroke-dasharray="5 4"><path d="M-40,0 A40,40 0 0 1 40,0Z"/><rect x="40" y="-22" width="26" height="22"/></g>`;
  return o+`</svg>`}
function missionScene(){
  const W=800,H=260,gy=205,mars=M.wk==="mars",X=p=>40+p/5.6*700;
  let o=`<svg viewBox="0 0 ${W} ${H}" class="scene" role="img" aria-label="Rover on ${M.W.n}">`+skyGround(W,H,gy,mars,"m");
  o+=`<circle cx="70" cy="50" r="${M.storm>0?10:16}" fill="#ffd166" opacity="${M.storm>0?.4:.95}"/>`;
  o+=`<g transform="translate(24,${gy})"><path d="M-22,0 A22,22 0 0 1 22,0Z" fill="#aab4d0"/><text y="20" text-anchor="middle" font-size="12" style="fill:var(--text)">Base</text></g>`;
  M.W.sites.forEach(s=>{const x=X(s.pos),got=M.used["c"+s.id];
    o+=`<g transform="translate(${x-24},${gy-28})">${rockG(s.sample,true)}</g>`;
    o+=`<text x="${x}" y="${gy+22}" text-anchor="middle" font-size="13" style="fill:var(--text)">${esc(s.n)}</text><text x="${x}" y="${gy+37}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${esc(s.sample)}</text>`;
    if(got)o+=`<circle cx="${x}" cy="${gy-44}" r="8" fill="#22c55e"/><path d="M${x-4},${gy-44} l3,4 l6,-8" stroke="#fff" stroke-width="2" fill="none"/>`});
  o+=`<g id="rv" opacity="${M.over&&M.ev.dead?.45:1}"><g transform="scale(1.35)">${roverSVG({crew:M.crewed,power:M.opts.power,tools:M.opts.tools==="full",dust:M.dust,wheel:M.wheel})}</g></g>`;
  if(M.storm>0){o+=`<rect width="${W}" height="${H}" fill="#b9824a" opacity=".3"/>`;for(let i=0;i<14;i++)o+=`<line class="streak" x1="0" y1="${30+i*14}" x2="60" y2="${30+i*14}" stroke="#e3b27a" stroke-width="2" opacity=".6" style="animation-delay:${(-i*.17).toFixed(2)}s"/>`;o+=`<text x="${W/2}" y="30" text-anchor="middle" font-size="18" font-weight="700" style="fill:#fff">Dust storm!</text>`}
  if(M.over&&M.ev.dead)o+=`<text x="${W/2}" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#f87171">Signal lost</text>`;
  return o+`</svg>`}
function animRover(){
  const g=document.getElementById("rv");if(!g||!M)return;const gy=205,X=p=>40+p/5.6*700,cur=X(M.pos),prev=M.px===undefined?cur:M.px;
  g.style.transition="none";g.style.transform=`translate(${prev}px,${gy}px)`;g.getBoundingClientRect();
  g.style.transition="transform .9s ease-in-out";g.style.transform=`translate(${cur}px,${gy}px)`;M.px=cur}
const MATCOL={alu:"#aab4d0",ti:"#8b909c",steel:"#7e8794",honey:"#dcb685",carbon:"#2f323d"};
function outpostScene(){
  const gy=190,W=800,H=240,res=OD.tested?OD.res:null,site=SITES[S.site||"mare"];
  let o=`<svg viewBox="0 0 ${W} ${H}" class="scene" role="img" aria-label="Your outpost design">`+skyGround(W,H,gy,false,"o");
  o+=`<text x="16" y="26" font-size="15" style="fill:var(--text)">${esc(site.n)}</text>`;
  const pos={home:130,water:270,wc:350,lab:480,pad:670},dims={home:[60,50],water:[26,54],wc:[22,34],lab:[54,40],pad:[66,12]},nm={home:"Home",water:"Water",wc:"Toilets",lab:"Lab",pad:"Pad"};
  MODS.forEach((m,i)=>{
    const d=OD.mods[m.id],[w,h]=dims[m.id],col=MATCOL[d.mat],kap=d.ins==="kapton";
    let b="";
    if(m.id==="home")b=`<path d="M-48,0 A48,48 0 0 1 48,0Z"/><rect x="48" y="-26" width="26" height="26"/><circle cx="0" cy="-24" r="6" fill="#60a5fa" stroke="none"/><path d="M0,-48 V-66 M-8,-60 H8" stroke="#cbd0e6" fill="none"/>`;
    if(m.id==="water")b=`<rect x="-24" y="-52" width="48" height="52" rx="8"/><rect x="-20" y="-24" width="40" height="22" rx="4" fill="#4aa8ff" stroke="none"/>`;
    if(m.id==="wc")b=`<rect x="-20" y="-32" width="40" height="32"/><rect x="-6" y="-20" width="12" height="20" fill="#1b1f33" stroke="none"/>`;
    if(m.id==="lab")b=`<path d="M-52,0 V-30 L-40,-40 H40 L52,-30 V0Z"/><rect x="-18" y="-24" width="36" height="24" fill="#1b1f33" stroke="none"/>`;
    if(m.id==="pad")b=`<ellipse cx="0" cy="-4" rx="64" ry="9"/><text y="0" text-anchor="middle" font-size="12" fill="#fff" stroke="none">H</text>`;
    o+=`<g transform="translate(${pos[m.id]},${gy})"><g fill="${col}" stroke="${kap?"#f2b632":"#fff"}" stroke-opacity="${kap?1:.35}" stroke-width="${kap?3.5:1}">${b}</g>`;
    if(d.reg)o+=`<path d="M${-w-8},0 Q${-w*.6},${-h*1.15} 0,${-h*1.2} Q${w*.6},${-h*1.15} ${w+8},0Z" fill="#8a7a62" opacity=".78"/><circle cx="${-w*.3}" cy="${-h*.4}" r="2" fill="#5d5242"/><circle cx="${w*.25}" cy="${-h*.55}" r="2" fill="#5d5242"/>`;
    o+=`<text y="18" text-anchor="middle" font-size="12" style="fill:var(--text)">${nm[m.id]}</text>`;
    if(res){const r=res[i];
      if(r.ok)o+=`<circle cy="${-h-26}" r="10" fill="#22c55e"/><path d="M-5,${-h-26} l4,5 l7,-9" stroke="#fff" stroke-width="2.5" fill="none"/>`;
      else o+=`<circle cy="${-h-26}" r="10" fill="#ef4444"/><path d="M-4,${-h-30} l8,8 M4,${-h-30} l-8,8" stroke="#fff" stroke-width="2.5"/><path d="M-6,0 L2,${-h*.4} L-4,${-h*.7} L4,${-h}" stroke="#ef4444" stroke-width="2.5" fill="none"/>`}
    o+=`</g>`});
  return o+`</svg><p class="small muted">Gold outline = full Kapton and Mylar insulation. Brown mound = regolith cover. Colour shows the structure material.</p>`}

/* ============ RENDER ============ */
function chips(){
  $("#chips").innerHTML=
   '<span class="chip">'+MD().icon+' '+MD().n+'</span><span class="chip">⭐ '+S.sp+' SP</span><span class="chip">💰 '+(MD().free?'∞':'$'+Math.round(S.budget)+'M')+'</span>'+
   (S.astro?'<span class="chip">'+S.astro.icon+' '+esc(S.astro.name)+'</span>':'')+
   '<span class="chip">Reliability '+S.rel+'/'+MD().rel+'%</span>';
}
function render(){chips();stopLanding();
  const f={modes,hub,brief:renderBrief,mission:renderMission,debrief:renderDebrief,lab,quiz:renderQuiz,codex,landing:renderLanding,crew,choice,outpost:renderOutpost}[V];
  $("#app").innerHTML=f();if(V==="landing")initLanding();if(V==="mission")animRover();
}
function stageBar(){
  const st=S.stage,n=["1 · Scout (rovers)","2 · Land (humans)","3 · Build (outpost)"];
  return '<div class="stages">'+n.map((x,i)=>'<div class="'+((st>i+1)?'done':(st===i+1?'on':''))+'">'+(st>i+1?"✓ ":"")+x+'</div>').join("")+'</div>';
}
function barH(label,v,max,cls){const p=Math.max(0,Math.min(100,v/max*100));return '<div class="small">'+label+' '+Math.round(v)+'</div><div class="bar '+(cls||(p<25?'danger':p<50?'warn':''))+'"><i style="width:'+p+'%"></i></div>'}

function modes(){
  return '<div class="card"><h2>Choose your training mode</h2><p class="muted">'+(S.mode?'Starting a new simulation erases your current progress.':'Pick how tough Mission Control should be. You can start over in another mode any time.')+'</p></div><div class="grid">'+
   Object.keys(MODES).map(k=>{const m=MODES[k];return '<div class="card" style="margin:0"><h3>'+m.icon+' '+m.n+'</h3><p class="small muted">'+m.tag+'</p><p class="small">'+esc(m.desc)+'</p><button class="primary" onclick="pickMode(\''+k+'\')">Start '+m.n+'</button></div>'}).join("")+'</div>'+
   (S.mode?'<div class="row" style="margin-top:12px"><button onclick="go(\'hub\')">← Keep current simulation</button></div>':'');
}
function pickMode(k){
  S=fresh();S.mode=k;const m=MODES[k];S.budget=m.free?99999:Math.round(220*m.budget);
  if(m.free)Object.keys(ROVERS).forEach(r=>{if(ROVERS[r].unlock>=0&&ROVERS[r].mass>0)S.rovers[r]=1});
  save();toast(m.n+" mode started");go("hub");
}
function jump(n){
  if(n>=2){WORLDS.moon.types.forEach(t=>S.samples.moon[t]=1);S.site=S.site||"mare";S.pending=null}
  if(n>=3){S.rel=100}
  S.stage=n;S.pending=null;save();go("hub");
}
function hub(){
  const st=S.stage;
  let mission="";
  if(S.pending==="site")mission='<button class="primary" onclick="go(\'choice\')">Stage 1 complete: choose your outpost site →</button>';
  else if(S.pending==="method")mission='<button class="primary" onclick="go(\'choice\')">Stage 2 complete: choose your building method →</button>';
  else if(st===1)mission='<button class="primary" onclick="startBrief(\'moon\')">🛻 Plan a Moon rover mission</button>';
  else if(st===2)mission='<button class="primary" onclick="go(\'landing\')">🛬 Landing practice ($5M)</button> <button class="primary" onclick="go(\'crew\')" '+(S.rel<MD().rel?'disabled':'')+'>👩‍🚀 Launch crew ('+(S.rel<MD().rel?'needs '+MD().rel+'% reliability':'ready')+')</button>';
  else if(st===3)mission='<button class="primary" onclick="startOutpost()">🏗️ Plan the outpost</button>';
  else mission='<button class="primary" onclick="startBrief(\'mars\')">🔴 Mars training (bonus world)</button>';
  if(MD().free&&st<4)mission+=' <button onclick="startBrief(\'mars\')">🔴 Try Mars</button>';
  const moon=Object.keys(S.samples.moon),mars=Object.keys(S.samples.mars);
  return '<div class="card"><h2>Mission Control</h2>'+hubScene()+stageBar()+
   '<p class="muted">'+({1:"Scout the Moon with rovers. Collect and send back all 4 Moon sample types to unlock human landings.",
     2:"Prove a reliable landing system until your reliability reaches "+MD().rel+"%, then launch a crew with the Apollo-style rover.",
     3:"Build a working outpost. Pick materials that trade weight, strength and cost, then survive a stress test.",
     4:"Moon outpost working! Try the harder Mars world with a 1-sol command delay."})[st>3?4:st]+'</p>'+
   '<div class="row">'+mission+'</div></div>'+
   '<div class="grid">'+
   '<div class="card"><h3>🧪 Samples</h3>'+rocksRow("moon")+(mars.length?rocksRow("mars"):"")+'</div>'+
   '<div class="card"><h3>⭐ Earn Science Points</h3><div class="row">'+(MD().lab?'<button onclick="go(\'lab\')">🧑‍🚀 Survival Lab</button>':'')+'<button onclick="startQuiz()">❓ Quiz</button></div><p class="small muted">Points depend on complexity, price and value of the task. Each point also brings in funding.</p></div>'+
   '<div class="card"><h3>📖 Rover catalog</h3><button onclick="go(\'codex\')">Open catalog</button></div>'+
   '<div class="card"><h3>⚙️ Simulation</h3><p class="small">Mode: <b>'+MD().icon+' '+MD().n+'</b> <span class="muted">'+MD().tag+'</span></p><button class="sm" onclick="go(\'modes\')">🔄 New simulation / change mode</button>'+(MD().free?'<p class="small muted" style="margin-top:8px">Free Play: jump to a stage</p><div class="row"><button class="sm" onclick="jump(1)">Stage 1</button><button class="sm" onclick="jump(2)">Stage 2</button><button class="sm" onclick="jump(3)">Stage 3</button><button class="sm" onclick="jump(4)">Mars</button></div>':'')+'</div>'+
   '</div>';
}

/* ============ SURVIVAL LAB ============ */
function lab(){
  const rows=ACT.map((a,i)=>{
    const done=S.done[i],locked=a[4]>S.stage&&S.stage<4?(a[4]>S.stage):false;
    const dis=done||locked||S.energy<actEnergy(a)||S.budget<a[2];
    return '<div class="card" style="margin:6px 0;opacity:'+(done?.55:1)+'"><div class="row spread"><div><b>'+esc(a[0])+'</b><br><span class="tag">complexity '+a[1]+'</span><span class="tag">$'+a[2]+'M</span><span class="tag">value '+a[3]+'</span><span class="tag">⚡'+actEnergy(a)+'</span><span class="tag good">+'+actPts(a)+' SP</span>'+(locked?'<span class="tag">unlocks Stage '+a[4]+'</span>':'')+'</div>'+
     '<button '+(dis?'disabled':'')+' onclick="doAct('+i+')">'+(done?'✓ Done':'Do it')+'</button></div>'+(done?'<p class="small muted">'+esc(a[5])+'</p>':'')+'</div>';
  }).join("");
  return '<div class="card"><div class="row spread"><h2>🧑‍🚀 Survival Lab (Day '+S.day+')</h2><button onclick="go(\'hub\')">← Back</button></div>'+
    '<p class="muted">Junior astronaut chores keep you alive and teach real science. Energy left today: <b>'+S.energy+'/6</b>.</p><button onclick="S.energy=6;S.day++;save();render()">😴 Sleep (new day)</button></div>'+rows;
}
function doAct(i){const a=ACT[i];S.energy-=actEnergy(a);S.budget-=a[2];S.done[i]=1;toast("Learned: "+a[5]);setTimeout(()=>{award(actPts(a),a[0]);render()},50);save();render()}

/* ============ MISSION ENGINE ============ */
function launch(){
  const t=bTotals(),W=WORLDS[brief.wk],R=ROVERS[brief.rover],p=brief.pick;
  S.budget-=t.launch;S.missions++;
  const crewed=brief.crewed;
  M={wk:brief.wk,W,R,crewed,opts:Object.assign({},p),power:100,wheel:100,dust:0,storm:0,pos:0,at:null,carried:[],sent:[],used:{},steps:crewed?(p.bat==="ext"?16:12):W.steps+MD().steps,
     over:false,why:"",queue:[],log:[],ev:{},sp:0,wasted:0,cost:t.launch,instr:0,total:crewed?(p.bat==="ext"?16:12):W.steps+MD().steps};
  if(crewed){M.opts.power="battery"}
  addLog("Launch successful! "+(crewed?"Crew ready on the Moon.":R.n+" has landed on "+W.n+"."),"ok");
  save();go("mission");
}
function addLog(m,c){M.log.unshift('<p class="'+(c||'')+'">'+esc(m)+'</p>')}
function actLabel(a){
  if(a.t==="drive")return "Drive to "+M.W.sites.find(s=>s.id===a.s).n;
  return {collect:"Collect sample",transmit:M.crewed?"Pack & send sample return":"Transmit to Earth",charge:"Charge / wait",clean:"Clean panels",instr:"Run science instrument"}[a.t];
}
function renderMission(){
  const W=M.W,solar=M.opts.power==="solar",q=W.queue>1&&!M.crewed;
  const pts=W.sites.map(s=>'<div class="pt" style="left:'+(s.pos/5.6*92+4)+'%"><span>'+s.icon+'</span>'+s.n+'</div>').join("")+'<div class="pt" style="left:4%;"><span>🏠</span>Base</div>';
  const rvx=(M.pos/5.6*92+4);
  const btn=(a,label,dis)=>'<button class="sm" '+(dis?'disabled':'')+' onclick=\'act('+JSON.stringify(a)+')\'>'+label+'</button>';
  const sitesBtn=W.sites.map(s=>btn({t:"drive",s:s.id},"🚗 "+s.n,M.over||(!q&&M.wheel<=0))).join(" ");
  const dis=M.over;
  return '<div class="card"><div class="row spread"><h2>'+W.icon+' '+(M.crewed?"Crewed LRV mission":M.R.n+" mission")+'</h2><span class="chip">Step '+(M.total-M.steps)+'/'+M.total+'</span></div>'+
   '<div class="grid"><div>'+(M.opts.power==="battery"?barH("Battery",M.power,100):barH("⚡ Power",M.power,100))+'</div>'+(M.crewed?"":'<div>'+barH("🛞 Wheels",M.wheel,100)+'</div>')+(solar?'<div>'+barH("🌫️ Dust on panels",100-M.dust,100)+'</div>':'')+'</div>'+
   '<p class="small">'+(M.storm>0?'<b class="bad">🌪️ Dust storm! ('+M.storm+' steps left)</b> ':'☀️ Clear skies. ')+'Carrying: '+(M.carried.length?M.carried.join(", "):"nothing")+' · Sent: '+(M.sent.length?M.sent.join(", "):"nothing")+'</p>'+
   missionScene()+
   '<div class="row">'+sitesBtn+'</div><div class="row" style="margin-top:8px">'+
   btn({t:"collect"},"⛏️ Collect sample",dis)+btn({t:"transmit"},M.crewed?"📦 Pack & send return":"📡 Transmit",dis)+btn({t:"charge"},"🔋 Charge / wait",dis)+
   (solar&&M.opts.dust==="shield"?btn({t:"clean"},"⚡ Clean panels",dis):"")+(M.opts.tools==="full"?btn({t:"instr"},"🔬 Instrument",dis):"")+
   '<button class="sm" '+(dis?'disabled':'')+' onclick="finishMission(\'You ended the mission.\')">🛑 End mission</button></div>'+
   (q?'<div class="card" style="margin:10px 0 0"><b>Command queue</b> ('+M.queue.length+'/'+W.queue+') <span class="small muted">Orders arrive a sol late, so you plan blind.</span><div class="small">'+(M.queue.length?M.queue.map((a,i)=>(i+1)+'. '+actLabel(a)).join(" → "):"Add 3 commands, then send them.")+'</div><div class="row" style="margin-top:6px"><button class="primary sm" '+(M.queue.length<W.queue||dis?'disabled':'')+' onclick="sendQueue()">Send queue</button><button class="sm" onclick="M.queue=[];render()">Clear</button></div></div>':'')+
   '</div>'+tip()+'<div class="card"><b>Mission log</b><div class="log">'+M.log.join("")+'</div></div>';
}
function tip(){
  if(!MD().hints||M.over)return"";const solar=M.opts.power==="solar";let t;
  if(M.power<25)t="Power is low. Charge or wait before driving.";
  else if(M.storm>0&&solar)t="Dust storm! Solar charging is almost zero. Save power and wait it out.";
  else if(M.carried.length&&M.steps<5)t="Time is almost up. Transmit your samples now!";
  else if(M.at&&!M.used["c"+M.at])t="You are at a site. Collect a sample.";
  else if(M.carried.length)t="Transmit your samples to Earth so they count.";
  else t="Pick a site and drive. Closer sites cost less power.";
  return '<div class="card"><span class="small good">💡 Tip: '+esc(t)+'</span></div>';
}
function act(a){
  if(M.over)return;
  if(M.W.queue>1&&!M.crewed){if(M.queue.length<M.W.queue){M.queue.push(a);render()}return}
  step(a);render();
}
function sendQueue(){
  addLog("Sol begins: commands arrive late, rover runs the queue by itself.","ev");M.ev.delay=1;
  const q=M.queue;M.queue=[];
  for(const a of q){if(M.over)break;step(a)}
  render();
}
function step(a){
  const W=M.W,solar=M.opts.power==="solar",cr=M.crewed;let cost=0;
  const fail=m=>{addLog(m,"er");M.wasted++};
  const tl=M.opts.tools==="full"?1.15:1;
  if(a.t==="drive"){
    const s=W.sites.find(x=>x.id===a.s);
    if(!cr&&M.wheel<=0)fail("Wheels are broken: the rover cannot drive.");
    else if(M.at===s.id)fail("Already at "+s.n+".");
    else{
      cost=Math.max(2,Math.round(Math.abs(s.pos-M.pos)*4*M.R.drive*tl));
      if(M.power-cost<1)fail("Not enough power for that drive ("+cost+" needed).");
      else{M.power-=cost;M.pos=s.pos;M.at=s.id;addLog("Drove to "+s.n+" (-"+cost+" power).");
        if(!cr&&rnd()<s.rocky*W.rock*MD().rock*1.4){const d=M.opts.wheels==="tough"?7:22;M.wheel-=d;M.ev.wheel=1;addLog("Sharp rocks scratch the wheels! (-"+d+"% wheel health)","er");
          if(M.wheel<=0){M.ev.stuck=1;addLog("A wheel failed. The rover is stuck here.","er")}}}
    }
  }else if(a.t==="collect"){
    const s=W.sites.find(x=>x.id===M.at);cost=cr?5:8;
    if(!s)fail("Not at any sample site.");
    else if(M.used["c"+s.id]||M.carried.includes(s.sample)&&0)fail("Already collected from "+s.n+".");
    else if(M.power-cost<1)fail("Not enough power to run the drill.");
    else if(M.carried.length>=4)fail("Sample bin is full. Transmit first.");
    else{M.power-=cost;M.used["c"+s.id]=1;M.carried.push(s.sample);addLog("Collected "+s.sample+"! "+SAMPLE_INFO[s.sample],"ok")}
  }else if(a.t==="transmit"){
    cost=cr?3:4;
    if(!M.carried.length)fail("Nothing to send.");
    else if(M.power-cost<1)fail("Not enough power to transmit.");
    else{M.power-=cost;M.carried.forEach(t=>{if(!M.sent.includes(t))M.sent.push(t)});addLog("Sent "+M.carried.join(", ")+" to Earth!","ok");M.carried=[]}
  }else if(a.t==="charge"){
    if(cr)addLog("Waiting uses crew oxygen. Batteries do not recharge.");
    else{const g=solar?Math.round(14*(1-M.dust/100)*(M.storm>0?.15:1)):8;M.power=Math.min(100,M.power+g);addLog("Charging: +"+g+" power."+(solar&&M.dust>60?" Dusty panels give less.":""))}
  }else if(a.t==="clean"){
    cost=2;if(M.power-cost<1)fail("Not enough power to run the dust shield.");else{M.power-=cost;M.dust=0;addLog("Panels cleaned by the electrostatic shield.","ok")}
  }else if(a.t==="instr"){
    cost=6;const s=W.sites.find(x=>x.id===M.at);
    if(!s)fail("Move to a site first.");else if(M.used["i"+s.id])fail("Already measured here.");
    else if(M.power-cost<1)fail("Not enough power for the instruments (tools use Power).");
    else{M.power-=cost;M.used["i"+s.id]=1;M.instr++;M.ev.tools=1;addLog("Instrument reading at "+s.n+": weather, radiation and laser data.","ok")}
  }
  tick();
}
function tick(){
  const solar=M.opts.power==="solar",cr=M.crewed;
  if(!cr){
    if(M.storm>0){M.storm--;M.dust=Math.min(100,M.dust+8);if(M.storm===0)addLog("The dust storm clears.")}
    else{M.dust=Math.min(100,M.dust+4);if(solar&&M.opts.dust!=="shield"&&rnd()<.08&&M.dust>20){M.dust=Math.max(0,M.dust-25);addLog("A gust of wind clears some dust off the panels.")}
      if(rnd()<M.W.storm*MD().storm){M.storm=4;M.ev.dust=1;addLog("A dust storm begins!"+(solar?" Solar output collapses.":" Your nuclear battery keeps going."),"ev")}}
    const g=solar?Math.round(7*(1-M.dust/100)*(M.storm>0?.15:1)*10)/10:5;
    M.power=Math.min(100,M.power+g-2);
    if(!solar&&M.storm>0)M.ev.nuke=1;
  }
  M.steps--;
  if(M.power<=0.5){M.ev.dead=1;if(solar&&M.dust>50)M.ev.dust=1;finishMission("The rover ran out of power and fell silent."+(M.carried.length?" Untransmitted samples are lost.":""));return}
  if(M.steps<=0)finishMission("Mission time is up.");
  else if(cr&&M.power<=1)finishMission("The battery is flat.");
}
function finishMission(why){
  if(M.over)return;
  M.over=true;M.why=why;
  const wk=M.wk,store=S.samples[wk];let pts=0,fresh=[];
  M.sent.forEach(t=>{if(!store[t]){store[t]=1;fresh.push(t);pts+=10}else pts+=3});
  pts+=M.instr*(M.R===ROVERS.viper?8:5);
  const ok=M.sent.length>0&&(M.crewed?M.sent.length>=3:true);
  if(M.carried.length)M.ev.lostdata=1;
  if(ok)pts+=8;
  pts+=Math.round(M.cost/20);
  if(M.opts.tools==="full"&&M.instr===0)M.ev.tools=1;
  if(M.W.queue>1&&M.wasted>0)M.ev.delay=1;
  if(M.crewed)M.ev.lrv=1;
  if(M.R.mass>14||M.opts.power==="nuclear")M.ev.weight=1;
  M.pts=pts;M.fresh=fresh;M.ok=ok;
  // stage progress
  let adv="";
  if(wk==="moon"&&!M.crewed&&S.stage===1&&WORLDS.moon.types.every(t=>store[t])){S.pending="site";adv="All four Moon sample types collected! Stage 1 complete."}
  if(M.crewed&&ok&&S.stage===2){S.pending="method";adv="Crewed sample return done! Stage 2 complete."}
  M.adv=adv;
  S.sp+=pts;S.budget+=fund(pts);checkUnlocks();grantIfBroke();save();go("debrief");
}

   '<p class="good"><b>+'+M.pts+' Science Points</b> (+$'+fund(M.pts)+'M funding)</p>'+(M.adv?'<p class="good"><b>🎉 '+M.adv+'</b></p>':'')+

   '<div class="row" style="margin-top:10px">'+next+'</div></div>';
}

const KEY={};
function onKey(e,d){const m={ArrowUp:"u",w:"u"," ":"u",ArrowLeft:"l",a:"l",ArrowRight:"r",d:"r"}[e.key];if(m){KEY[m]=d;if(V==="landing")e.preventDefault()}}
window.addEventListener("keydown",e=>onKey(e,true));window.addEventListener("keyup",e=>onKey(e,false));
function stopLanding(){if(LND)LND.stop=true;LND=null}
function initLanding(){
  const site=SITES[S.site||"mare"],data=Object.keys(S.samples.moon).length;
  const bind=(id,k)=>{const b=$("#"+id);["pointerdown"].forEach(ev=>b.addEventListener(ev,e=>{KEY[k]=true;e.preventDefault()}));["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>KEY[k]=false))};
  bind("bL","l");bind("bU","u");bind("bR","r");
  LND={site,pw:Math.round((site.pad+data*4)*MD().pad),stop:false,state:"ready",c:$("#cv")};
  LND.pad=150+rnd()*400;
  const pts=[];for(let x=0;x<=700;x+=25){let y=355;const d=Math.abs(x-LND.pad);if(d>LND.pw/2+8)y=345+Math.sin(x*.07+LND.pad)*(site.id==="rim"?24:site.id==="high"?18:8)+rnd()*(site.id==="rim"?16:8);pts.push([x,y])}
  LND.terr=pts;
  LND.ground=x=>{if(Math.abs(x-LND.pad)<=LND.pw/2)return 355;const i=Math.max(0,Math.min(pts.length-2,Math.floor(x/25)));const t=(x-pts[i][0])/25;return pts[i][1]*(1-t)+pts[i+1][1]*t};
  LND.L={x:100,y:40,vx:0,vy:0,fuel:100};
  drawLanding(LND);
}
function newLanding(){
  if(!LND||LND.state==="flying")return;
  if(S.budget<5){toast("Not enough budget. Earn Science Points!");return}
  S.budget-=5;chips();$("#res").innerHTML="";
  initLanding();
  LND.state="flying";LND.L={x:80+rnd()*540,y:30,vx:(rnd()-.5)*40,vy:0,fuel:100};
  let last=performance.now();const me=LND;
  (function loop(now){
    if(me.stop)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    const L=me.L;let ax=0,ay=16;
    if(L.fuel>0){if(KEY.u){ay-=30;L.fuel-=10*dt}if(KEY.l){ax-=22;L.fuel-=4*dt}if(KEY.r){ax+=22;L.fuel-=4*dt}}
    L.vx+=ax*dt;L.vy+=ay*dt;L.x+=L.vx*dt;L.y+=L.vy*dt;
    me.dust=KEY.u&&L.y>260?(me.dust||0)+1:0;
    drawLanding(me);
    const gy=me.ground(L.x);
    if(L.x<0||L.x>700){me.state="done";endLanding(false,"The lander drifted away from the landing zone.");return}
    if(L.y+12>=gy){me.state="done";
      const onPad=Math.abs(L.x-me.pad)<=me.pw/2-6,vy=L.vy/10,vx=Math.abs(L.vx)/10;
      if(!onPad)endLanding(false,"You touched down off the flat pad. Rocks and slopes can tip a lander over.");
      else if(vy>MD().vy)endLanding(false,"Too fast! Touchdown at "+vy.toFixed(1)+" m/s broke a leg. Real landers must be slow and steady.");
      else if(vx>2)endLanding(false,"Too much sideways drift ("+vx.toFixed(1)+" m/s) tipped the lander.");
      else endLanding(true,"Soft touchdown at "+vy.toFixed(1)+" m/s with "+Math.round(L.fuel)+"% fuel left.");
      return}
    requestAnimationFrame(loop);
  })(last);
}
function drawLanding(me){
  const c=me.c.getContext("2d"),L=me.L;
  let g=c.createLinearGradient(0,0,0,420);g.addColorStop(0,"#02040f");g.addColorStop(1,"#18245a");c.fillStyle=g;c.fillRect(0,0,700,420);
  c.fillStyle="#fff";for(let i=0;i<70;i++){c.globalAlpha=.3+(i%5)*.14;c.fillRect((i*97)%700,(i*53)%240,1.5,1.5)}c.globalAlpha=1;
  g=c.createRadialGradient(612,60,2,620,66,26);g.addColorStop(0,"#9fd0ff");g.addColorStop(1,"#1e4fa8");c.fillStyle=g;c.beginPath();c.arc(620,66,26,0,6.3);c.fill();
  g=c.createLinearGradient(0,330,0,420);g.addColorStop(0,"#7a7fa3");g.addColorStop(1,"#363a5c");c.fillStyle=g;
  c.beginPath();c.moveTo(0,420);me.terr.forEach(p=>c.lineTo(p[0],p[1]));c.lineTo(700,420);c.fill();
  c.strokeStyle="#a9aed0";c.lineWidth=2;c.beginPath();me.terr.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();
  c.fillStyle="rgba(0,0,0,.2)";for(let i=0;i<6;i++){const x=(i*131+40)%700;if(Math.abs(x-me.pad)>me.pw/2+30){c.beginPath();c.ellipse(x,me.ground(x)+16+i*4,18+i*3,4+i%3,0,0,6.3);c.fill()}}
  c.fillStyle="#4ade80";c.fillRect(me.pad-me.pw/2,353,me.pw,5);
  c.fillStyle=(Math.floor(Date.now()/400)%2)?"#fde047":"#a16207";c.fillRect(me.pad-me.pw/2-3,349,4,9);c.fillRect(me.pad+me.pw/2-1,349,4,9);
  c.fillStyle="#cbd5f5";c.font="12px 'Times New Roman',serif";c.fillText("PAD",me.pad-10,375);
  if(me.dust>4){c.fillStyle="rgba(200,200,200,.25)";c.beginPath();c.arc(L.x,me.ground(L.x)-6,me.dust*1.5,0,6.3);c.fill()}
  c.save();c.translate(L.x,L.y);
  const fire=me.state==="flying"&&L.fuel>0;
  if(fire&&KEY.u){c.fillStyle="#fb923c";c.beginPath();c.moveTo(-5,6);c.lineTo(0,18+Math.random()*10);c.lineTo(5,6);c.fill();c.fillStyle="#fde047";c.beginPath();c.moveTo(-2.5,6);c.lineTo(0,13+Math.random()*5);c.lineTo(2.5,6);c.fill()}
  if(fire&&KEY.l){c.fillStyle="#fb923c";c.fillRect(11,-3,8+Math.random()*6,3)}
  if(fire&&KEY.r){c.fillStyle="#fb923c";c.fillRect(-19-Math.random()*6,-3,8+Math.random()*6,3)}
  c.strokeStyle="#cbd0e6";c.lineWidth=2;c.beginPath();c.moveTo(-9,6);c.lineTo(-16,12);c.moveTo(9,6);c.lineTo(16,12);c.stroke();
  c.fillStyle="#e5e7eb";c.beginPath();c.moveTo(-8,-12);c.lineTo(8,-12);c.lineTo(12,2);c.lineTo(-12,2);c.fill();
  c.fillStyle="#d6a23a";c.fillRect(-12,2,24,5);c.fillStyle="#60a5fa";c.beginPath();c.arc(0,-6,3.5,0,6.3);c.fill();
  c.restore();
  c.fillStyle="#eaf0ff";c.font="13px 'Times New Roman',serif";
  c.fillText("Vertical "+(L.vy/10).toFixed(1)+" m/s   Sideways "+(L.vx/10).toFixed(1)+" m/s   Fuel "+Math.max(0,Math.round(L.fuel))+"%",10,18);
}
function endLanding(ok,msg){
  S.landings++;const before=S.rel;
  S.rel=ok?Math.min(100,S.rel+25):Math.max(0,S.rel-10);
  if(ok)S.sp+=6,S.budget+=fund(6);
  grantIfBroke();save();chips();
  $("#res").innerHTML='<div class="debrief"><b class="'+(ok?"good":"bad")+'">'+(ok?"Successful landing! Reliability "+before+"% → "+S.rel+"%":"Landing failed. Reliability "+before+"% → "+S.rel+"%")+'</b><br>'+esc(msg)+'<br>'+(S.rel>=MD().rel?'Reliability is proven. You can launch a crew from Mission Control.':'Real missions land many times before people ride along.')+'</div>';
  const b=$("#bGo");if(b)b.textContent=S.budget<5?"Not enough budget":"Try again ($5M)";
}

/* ============ CREW ============ */
const ASTROS=[["🧑‍🚀","Sky"],["👩‍🚀","Nova"],["👨‍🚀","Orion"]];
function crew(){
  return '<div class="card"><div class="row spread"><h2>👩‍🚀 Choose your astronaut</h2><button onclick="go(\'hub\')">← Back</button></div><p class="muted">Your landing system is proven (reliability '+S.rel+'%). The crew rides the Apollo-style Lunar Roving Vehicle, faster than robot rovers but limited by batteries and oxygen.</p>'+
   '<div class="row">'+ASTROS.map(a=>'<button class="opt" style="width:auto" onclick="S.astro={icon:\''+a[0]+'\',name:\''+a[1]+'\'};save();startBrief(\'moon\',true)">'+a[0]+' '+a[1]+'</button>').join("")+'</div></div>';
}

/* ============ OUTPOST ============ */
const MODS=[
 {id:"home",n:"Living quarters & command module",icon:"🏠",mass:14,str:6,therm:7,shield:3,press:true},
 {id:"water",n:"Water tank",icon:"💧",mass:8,str:4,therm:7,shield:0},
 {id:"wc",n:"Toilets",icon:"🚽",mass:5,str:4,therm:4,shield:0},
 {id:"lab",n:"Rover garage & sample lab",icon:"🔬",mass:10,str:5,therm:4,shield:1},
 {id:"pad",n:"Landing pad",icon:"🛬",mass:6,str:6,therm:0,shield:0}
];
const MATS={
 alu:{n:"Aluminum alloy",m:1,s:6,c:1,sh:1,ctx:"Light and easy to build; the default backbone (ISS, Apollo)."},
 ti:{n:"Titanium alloy",m:1,s:9,c:2.2,sh:1,ctx:"Very strong for its weight; costs more to ship."},
 steel:{n:"Stainless steel",m:1.8,s:8,c:1,sh:3,ctx:"Durable and shields well, but heavy."},
 honey:{n:"Honeycomb sandwich panels",m:.7,s:7,c:1.6,sh:1,ctx:"Stiff and light: metal core between thin sheets."},
 carbon:{n:"Carbon fiber composite",m:.5,s:7,c:2.5,sh:0,ctx:"Lighter still, but pressurized bulkheads still rely on metal."}
};
const INS={basic:{n:"Basic blankets",t:4,m:1,c:1},kapton:{n:"Full Kapton and Mylar layers",t:8,m:1.5,c:3}};
function startOutpost(){OD={mods:{}};MODS.forEach(m=>OD.mods[m.id]={mat:"alu",ins:"basic",reg:false});go("outpost")}
function oCalc(){
  const site=SITES[S.site||"mare"];let mass=0,cost=0,anyReg=false;
  MODS.forEach(m=>{const d=OD.mods[m.id],mt=MATS[d.mat],ins=INS[d.ins];
    let mm=m.mass*mt.m+ins.m,cc=m.mass*mt.c+ins.c;
    if(m.id==="water"&&site.ice){mm*=.5;cc*=.5}
    if(d.reg){anyReg=true;cc+=2}
    mass+=mm;cost+=cc});
  let printer=0;if(anyReg&&!S.printer){mass+=8;cost+=12;printer=1}
  const ships=Math.max(1,Math.ceil(mass/30));cost+=ships*18;
  return {mass:Math.round(mass*10)/10,cost:Math.round(cost),ships,printer};
}
function oEval(){
  const site=SITES[S.site||"mare"];
  return MODS.map(m=>{const d=OD.mods[m.id],mt=MATS[d.mat],ins=INS[d.ins];
    let str=mt.s+(d.reg?1:0),sh=mt.sh+(d.reg?3:0),th=ins.t;
    if(m.press&&(d.mat==="carbon"||d.mat==="honey"))str-=d.mat==="carbon"?3:0;
    const needStr=Math.max(1,m.str+site.strength+MD().need),needTh=m.therm?Math.max(0,m.therm+site.thermal+MD().need):0,needSh=m.shield?Math.max(0,m.shield+MD().need):0,probs=[];
    if(str<needStr)probs.push("Structure too weak ("+str+" vs "+needStr+" needed): stress and micrometeorite hits cracked it"+(m.press?" and pressure was lost":"")+".");
    if(th<needTh)probs.push("Insulation too thin ("+th+" vs "+needTh+" needed): temperature swings froze or cooked it.");
    if(sh<needSh)probs.push("Radiation shielding too low ("+sh+" vs "+needSh+" needed): add steel or a regolith cover.");
    return {m,ok:!probs.length,probs,str,th,sh,needStr,needTh,needSh};
  });
}
function renderOutpost(){
  const site=SITES[S.site||"mare"],t=oCalc(),ev=OD.tested?OD.res:null,broke=S.budget<t.cost;
  const rows=MODS.map((m,i)=>{const d=OD.mods[m.id];const e=oEval()[i];
   return '<div class="card" style="margin:8px 0"><h3>'+m.icon+' '+m.n+'</h3><div class="row">'+
   '<label class="small">Structure <select onchange="OD.mods[\''+m.id+'\'].mat=this.value;OD.tested=0;render()">'+Object.keys(MATS).map(k=>'<option value="'+k+'" '+(d.mat===k?'selected':'')+'>'+MATS[k].n+'</option>').join("")+'</select></label>'+
   '<label class="small">Insulation <select onchange="OD.mods[\''+m.id+'\'].ins=this.value;OD.tested=0;render()">'+Object.keys(INS).map(k=>'<option value="'+k+'" '+(d.ins===k?'selected':'')+'>'+INS[k].n+'</option>').join("")+'</select></label>'+
   '<label class="small"><input type="checkbox" '+(d.reg?'checked':'')+' onchange="OD.mods[\''+m.id+'\'].reg=this.checked;OD.tested=0;render()"> 🖨️ Regolith cover</label></div>'+
   '<p class="small muted">'+esc(MATS[d.mat].ctx)+(MD().hints?' · Needs: strength '+e.needStr+', thermal '+e.needTh+(e.needSh?', shield '+e.needSh:'')+' · You have: strength '+e.str+', thermal '+e.th+', shield '+e.sh:'')+'</p>'+
   (ev?'<p class="small '+(ev[i].ok?'good':'bad')+'">'+(ev[i].ok?'✅ Stayed working through the stress test.':'❌ '+esc(ev[i].probs.join(" ")))+'</p>':'')+'</div>'}).join("");
  return '<div class="card"><div class="row spread"><h2>🏗️ Outpost at '+site.icon+' '+site.n+'</h2><button onclick="go(\'hub\')">← Back</button></div>'+
   '<p class="muted">Choose materials for each module. Ships carry 30 kg each, and every shipment costs $18M. The win condition is an outpost whose systems <b>keep working</b>, not the biggest one.</p>'+
   (site.ice?'<p class="small good">Ice nearby: the water tank costs half the weight and money.</p>':'')+(S.printer?'<p class="small good">Your printing rover is already on the Moon, so regolith covers cost almost nothing.</p>':'<p class="small muted">Regolith covers need a printing rover (+$12M and 8 kg shipped, once).</p>')+'</div>'+outpostScene()+rows+
   '<div class="card"><div class="row spread"><div><b>Total weight: '+t.mass+' kg → '+t.ships+' shipment'+(t.ships>1?'s':'')+'</b><br><b>Total cost: $'+t.cost+'M</b> (budget $'+Math.round(S.budget)+'M)</div>'+
   '<button class="primary" '+(broke?'disabled':'')+' onclick="buildOutpost()">🚀 Ship &amp; run stress test</button></div>'+(broke?'<p class="bad">Over budget. Choose lighter, cheaper materials or earn funding with quizzes and the Survival Lab.</p>':'')+
   (ev&&OD.win?'<div class="debrief"><b class="good">🎉 Outpost operational!</b> Every system kept working. '+(S.stage>=4?'Mars training is now unlocked.':'')+'</div><button class="primary" onclick="go(\'hub\')">Mission Control</button>':'')+
   (ev&&!OD.win?'<div class="debrief"><b>Systems failed.</b> No game over: change the materials and try again. Salvage returned $'+OD.refund+'M.<br>Real mission lesson: ISS and Apollo hulls use aluminum for light, strong structures; Kapton and Mylar blankets handle temperature swings.</div>':'')+'</div>';
}
function buildOutpost(){
  const t=oCalc();S.budget-=t.cost;if(t.printer)S.printer=true;
  const res=oEval();OD.res=res;OD.tested=1;OD.win=res.every(r=>r.ok);
  if(OD.win){S.stage=4;const pts=30+Math.max(0,Math.round(60-t.mass));S.sp+=pts;S.budget+=fund(pts);toast("Outpost built! +"+pts+" Science Points");OD.refund=0}
  else{OD.refund=Math.round(t.cost*.6);S.budget+=OD.refund}
  checkUnlocks();grantIfBroke();save();chips();render();
}

if(!S.mode)V="modes";
render();
</script>
